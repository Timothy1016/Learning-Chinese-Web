<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="index, follow" />
    <meta http-equiv="refresh" content="1; url=https://learning-chinese-web-tnl5.vercel.app/" />
    <title>Lóng — Chinese Learning App</title>
    <style>
      :root{color-scheme:light;--ink:#173f36;--muted:#70827b;--paper:#fffdf8;--gold:#efb35b;--line:#e3dfd5}
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 85% 12%,#fff1d7 0,transparent 28%),var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
      main{width:min(560px,100%);padding:42px;border:1px solid var(--line);border-radius:28px;background:rgba(255,255,255,.9);box-shadow:0 24px 70px rgba(23,63,54,.1);text-align:center}
      .mark{width:72px;height:72px;margin:auto;display:grid;place-items:center;border-radius:20px;background:var(--gold);font:42px Georgia,"Songti SC",serif}
      h1{margin:20px 0 8px;font:700 clamp(32px,7vw,48px) Georgia,"Songti SC",serif}p{margin:0 auto 24px;max-width:420px;color:var(--muted);line-height:1.65}
      a{display:inline-flex;min-height:46px;align-items:center;justify-content:center;padding:0 22px;border-radius:12px;background:var(--ink);color:#fff;text-decoration:none;font-weight:800}
      small{display:block;margin-top:18px;color:var(--muted)}
    </style>
  </head>
  <body>
    <main>
      <div class="mark">龙</div>
      <h1>Lóng</h1>
      <p>You are being redirected to the public learning app, ready to use on desktop, tablet, and phone.</p>
      <a href="https://learning-chinese-web-tnl5.vercel.app/">Open Lóng →</a>
      <small>Share this GitHub Pages link or the Vercel link with friends.</small>
    </main>
  </body>
</html>
